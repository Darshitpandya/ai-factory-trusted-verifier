[phases.setup]
nixPkgs = ["nodejs_22", "curl", "gnutar"]

[phases.install]
cmds = [
  "npm install -g pnpm@9",
  "pnpm install --frozen-lockfile",
  "curl -sSL https://github.com/tufin/oasdiff/releases/download/v1.35.0/oasdiff_1.35.0_linux_amd64.tar.gz -o /tmp/oasdiff.tar.gz && tar -xzf /tmp/oasdiff.tar.gz -C /usr/local/bin oasdiff && chmod +x /usr/local/bin/oasdiff && echo 'oasdiff installed:' && oasdiff --version"
]

[start]
cmd = "node --import tsx/esm src/server.ts"
